<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hallo - Updated</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  font-family:Arial;
  margin:0;
  padding:10px;
  background:#f3f4f7;
}
h1{
  margin:0 0 10px;
  font-size:22px;
}
.topBox{
  background:white;
  padding:12px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
input[type=file]{
  width:100%;
  margin-top:8px;
  padding:12px;
  font-size:16px;
  border:2px dashed #1976d2;
  border-radius:8px;
  background:#f8fbff;
}
.buttonWrap{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:12px;
  flex-wrap:wrap;
}
button{
  flex:none;
  min-width:79px;
  padding:6px 12px;
  height:34px;
  border:none;
  border-radius:6px;
  background:#1976d2;
  color:white;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}
#searchBox{
  flex:1;
  min-width:200px;
}
#searchInput{
  width:100%;
  height:34px;
  padding:0 10px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:12px;
}
#countRow{
  display:none;
  margin-top:10px;
  padding:10px;
  background:#eef7ff;
  border-radius:10px;
  font-size:13px;
  font-weight:bold;
  line-height:1.7;
}
#countRow span{
  cursor:pointer;
  padding:2px 6px;
  border-radius:4px;
}
#countRow span:hover{
  background:#dbeafe;
}
#countRow .active{
  background:#1976d2;
  color:white;
}
#status{
  margin-top:10px;
  font-size:14px;
}
.loading{color:#1976d2; font-weight:bold;}
.done{color:green; font-weight:bold;}
.error{color:#dc2626; font-weight:bold;}

#tripWrap{
  margin-top:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.tripRow{
  display:flex;
  align-items:flex-start;
  gap:10px;
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.new-trip {
  border-left: 5px solid #22c55e;
  background:#f0fdf4 !important;
}
.copyBtn{
  width:42px!important;
  min-width:42px!important;
  height:32px;
  padding:0!important;
  border-radius:10px;
  background:#03a9f4!important;
  color:white;
  border:none;
  cursor:pointer;
  flex:none;
  font-weight:bold;
}
.tripText{
  flex:1;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:13px;
  line-height:1.5;
}
</style>
</head>
<body>
<div class="topBox">
<h1>hello (v2)</h1>
<input type="file" id="file" accept=".csv">

<div class="buttonWrap">
<button onclick="readCSV()">FORMAT</button>
<button onclick="sortByName()">SORT</button>
<button onclick="detectReturns()">RETURNS</button>
<button onclick="filterEarlyTripsOnly()">EARLY TRIP</button>
<div id="searchBox">
<input id="searchInput" type="text" placeholder="Search..." oninput="searchTrips()">
</div>
</div>

<div id="countRow"></div>
<div id="status"></div>
</div>

<div id="tripWrap"></div>

<script>
let formattedTrips = [];
let currentTrips = [];
let displayTrips = [];
let patientCount = {};
let currentFilter = 'all';

let previousTrips = [];
let newTrips = [];
let removedTrips = [];

function setStatus(text, cls=""){
  const el = document.getElementById("status");
  el.className = cls;
  el.innerHTML = text;
}

function keepText(v){
  return String(v ?? "").replace(/[\r\n\t]+/g," ").replace(/\s+/g," ").trim();
}

// ==================== IMPROVED TIME PARSING ====================
function isPickupTimeText(v){
  v = keepText(v);
  // Old format: 6/30 11:47 PM
  // New format: 6/30/2026  8:30:00 AM
  return /\d{1,2}\/\d{1,2}(\/\d{4})?\s+\d{1,2}:\d{2}(:\d{2})?\s*(AM|PM)/i.test(v) ||
         /\d{1,2}:\d{2}\s*(AM|PM)/i.test(v);
}

function getPickupTime(str){
  str = keepText(str);
  
  // Extract time part (handles both old and new formats)
  let match = str.match(/(\d{1,2}:\d{2}(:\d{2})?)\s*(AM|PM)/i);
  if(match){
    let time = match[1].split(':').slice(0,2).join(':'); // remove seconds
    return time + " " + match[3].toUpperCase();
  }
  
  // Fallback
  let d = new Date(str);
  if(!isNaN(d)){
    return d.toLocaleTimeString("en-US",{hour:"numeric", minute:"2-digit"});
  }
  return str;
}

function timeToMinutes(time){
  let m = keepText(time).match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(!m) return 99999;
  let h = parseInt(m[1],10);
  let min = parseInt(m[2],10);
  let ap = m[3].toUpperCase();
  if(ap === "PM" && h !== 12) h += 12;
  if(ap === "AM" && h === 12) h = 0;
  return h * 60 + min;
}

// ==================== COMPARISON LOGIC ====================
function compareWithPrevious(){
  newTrips = [];
  removedTrips = [];
  if(!previousTrips.length || !formattedTrips.length) return;

  const prevSet = new Set(previousTrips.map(t => `${t.passengerKey}|${t.pickupTime}`));
  const currentSet = new Set(formattedTrips.map(t => `${t.passengerKey}|${t.pickupTime}`));

  newTrips = formattedTrips.filter(t => !prevSet.has(`${t.passengerKey}|${t.pickupTime}`));
  removedTrips = previousTrips.filter(t => !currentSet.has(`${t.passengerKey}|${t.pickupTime}`));
}

// ==================== MAIN PARSER ====================
async function readCSV(){
  try{
    const file = document.getElementById("file").files[0];
    if(!file) return alert("Select CSV");

    setStatus("Reading CSV...", "loading");

    const text = await file.text();
    const result = Papa.parse(text,{
      header:false,
      skipEmptyLines:true,
      quoteChar:'"',
      escapeChar:'"',
      dynamicTyping:false
    });

    let data = result.data;
    if(!data || !data.length) return setStatus("No rows found","error");

    // Save previous
    if(formattedTrips.length > 0){
      previousTrips = formattedTrips.map(t => ({...t}));
    }

    let rows = data.slice(1);
    formattedTrips = [];
    patientCount = {};
    currentFilter = 'all';

    let tempTrips = [];
    let nameCount = {};

    rows.forEach((row)=>{
      // Handle shifted columns due to commas in notes
      while(row.length > 21){
        if(!isPickupTimeText(row[8]) && isPickupTimeText(row[9])){
          row[7] = keepText(row[7] + ", " + row[8]).replace(/^"+|"+$/g,"");
          row.splice(8,1);
        } else break;
      }

      if(row.length < 21) return;

      let tripId = keepText(row[0]);
      let passenger = keepText(row[17]);
      if(!tripId || !passenger) return;

      let key = passenger.toLowerCase();

      let trip = {
        tripId,
        passenger,
        passengerKey: key,
        passengerPhone: keepText(row[20]),
        pickupTime: getPickupTime(keepText(row[8])),
        pickupFull: keepText([row[3],row[4],row[5],row[6]].join(" ")),
        dropFull: keepText([row[9],row[10],row[11],row[12]].join(" ")),
        service: getService(keepText(row[13])),
        pax: keepText(row[18]) || "1",
        notes: keepText(row[7]),
        copied:false,
        line:""
      };

      tempTrips.push(trip);
      nameCount[key] = (nameCount[key] || 0) + 1;
    });

    formattedTrips = tempTrips.map(t => {
      let rtText = nameCount[t.passengerKey] > 1 ? " R/T" : "";
      let phoneText = t.passengerPhone ? " --- " + t.passengerPhone : "";
      t.line = `PU ${t.pickupTime} --- ${t.tripId} --- ${t.passenger}${phoneText}  ${t.service}${rtText} From ${t.pickupFull} To ${t.dropFull} PAX:${t.pax} Bill To Kern`;
      if(t.notes) t.line += "  --Notes: " + t.notes;
      return t;
    });

    formattedTrips.sort((a,b) => timeToMinutes(a.pickupTime) - timeToMinutes(b.pickupTime));
    
    patientCount = nameCount;
    currentTrips = formattedTrips.slice();

    compareWithPrevious();
    searchTrips();
    setStatus(`${formattedTrips.length} trips formatted successfully`, "done");

  }catch(err){
    console.error(err);
    setStatus("Error: " + err.message, "error");
  }
}

// ==================== REST OF YOUR FUNCTIONS (unchanged) ====================
function getService(serviceRaw){
  let s = keepText(serviceRaw).toLowerCase();
  if(s.includes("curb") || s.includes("c2c") || s.includes("door") || s.includes("d2d")) return "AMB";
  if(s.includes("wheelchair") || s.includes("wheel chair") || s === "wc") return "WC";
  if(s.includes("gurney") || s === "gur") return "GUR";
  if(s.includes("bariatric") || s === "bar") return "BAR";
  return keepText(serviceRaw);
}

function applyFilter(filterType) {
  currentFilter = filterType;
  if (filterType === 'all') currentTrips = formattedTrips.slice();
  else if (filterType === 'single') currentTrips = formattedTrips.filter(t => patientCount[t.passengerKey] === 1);
  else if (filterType === 'round') currentTrips = formattedTrips.filter(t => patientCount[t.passengerKey] === 2);
  else if (filterType === 'multiple') currentTrips = formattedTrips.filter(t => patientCount[t.passengerKey] >= 3);
  searchTrips();
}

function searchTrips(){
  const q = keepText(document.getElementById("searchInput").value).toLowerCase();
  let filtered = currentTrips;
  if(q) filtered = currentTrips.filter(t => t.line.toLowerCase().includes(q));
  displayTrips = filtered;
  updateOutput();
  updateCounts();
}

function updateOutput(){
  const wrap = document.getElementById("tripWrap");
  wrap.innerHTML = "";

  displayTrips.forEach((t,i)=>{
    const row = document.createElement("div");
    row.className = `tripRow ${newTrips.some(nt => nt.passengerKey === t.passengerKey && nt.pickupTime === t.pickupTime) ? 'new-trip' : ''}`;

    const copyBtn = document.createElement("button");
    copyBtn.className = "copyBtn";
    copyBtn.innerHTML = i + 1;
    copyBtn.title = "Copy Trip";

    if(t.copied) copyBtn.style.setProperty("background", "#16a34a", "important");

    copyBtn.onclick = async ()=>{
      await navigator.clipboard.writeText(t.line);
      t.copied = true;
      copyBtn.style.setProperty("background", "#16a34a", "important");
      setStatus("Trip copied", "done");
    };

    const text = document.createElement("div");
    text.className = "tripText";
    text.innerText = t.line;

    row.appendChild(copyBtn);
    row.appendChild(text);
    wrap.appendChild(row);
  });
}

function updateCounts(){
  const row = document.getElementById("countRow");
  if(!formattedTrips.length) return row.style.display = "none";

  let totalTrips = formattedTrips.length;
  let totalPatients = Object.keys(patientCount).length;
  let single = 0, round = 0, multi = 0;

  Object.values(patientCount).forEach(c => {
    if(c===1) single++;
    else if(c===2) round++;
    else if(c>=3) multi++;
  });

  let comp = previousTrips.length ? 
    `| <span onclick="showNewTripsOnly()" style="color:#22c55e">New: ${newTrips.length}</span> | <span onclick="showRemovedTripsOnly()" style="color:#ef4444">Removed: ${removedTrips.length}</span>` : '';

  row.innerHTML = `
    Total trips: ${totalTrips} | Total patients: ${totalPatients} | 
    <span onclick="applyFilter('single')" ${currentFilter==='single'?'class="active"':''}>Single: ${single}</span> | 
    <span onclick="applyFilter('round')" ${currentFilter==='round'?'class="active"':''}>Round: ${round}</span> | 
    <span onclick="applyFilter('multiple')" ${currentFilter==='multiple'?'class="active"':''}>Multi: ${multi}</span> 
    ${comp} | Showing: ${displayTrips.length}
  `;
  row.style.display = "block";
}

function showNewTripsOnly(){
  if(!newTrips.length) return alert("No new trips");
  currentTrips = newTrips;
  currentFilter = 'new';
  searchTrips();
  setStatus(`Showing ${newTrips.length} New Trips`, "done");
}

function showRemovedTripsOnly(){
  if(!removedTrips.length) return alert("No removed trips");
  currentTrips = removedTrips.map(t => ({...t, line: `(REMOVED) ${t.line}`}));
  currentFilter = 'removed';
  searchTrips();
  setStatus(`Showing ${removedTrips.length} Removed Trips`, "done");
}

function sortByName(){
  if(!currentTrips.length) return alert("Upload first");
  currentTrips.sort((a,b) => a.passenger.localeCompare(b.passenger));
  searchTrips();
  setStatus("Sorted by name", "done");
}

function detectReturns(){
  let groups = {};
  formattedTrips.forEach(t=>{
    if(!groups[t.passengerKey]) groups[t.passengerKey] = [];
    groups[t.passengerKey].push(t);
  });

  Object.keys(groups).forEach(key=>{
    let arr = groups[key].slice().sort((a,b)=> timeToMinutes(a.pickupTime) - timeToMinutes(b.pickupTime));
    if(arr.length < 2) return;
    let first = arr[0];
    let returnTimes = arr.slice(1).map(t=>t.pickupTime).filter(t=>t && t !== "11:47 PM");
    if(!returnTimes.length) return;
    first.line = first.line.replace(/\s+Return@[^\n]+/g, "");
    returnTimes.forEach(time=>{
      if(!first.line.includes("Return@" + time)){
        first.line += " Return@" + time;
      }
    });
  });

  searchTrips();
  setStatus("Returns detected", "done");
}

function filterEarlyTripsOnly(){
  if(!formattedTrips.length) return alert("Upload first");
  let groups = {};
  formattedTrips.forEach(t => {
    if(!groups[t.passengerKey]) groups[t.passengerKey] = [];
    groups[t.passengerKey].push(t);
  });
  currentTrips = Object.keys(groups).map(k => 
    groups[k].slice().sort((a,b)=> timeToMinutes(a.pickupTime) - timeToMinutes(b.pickupTime))[0]
  );
  currentTrips.sort((a,b)=> timeToMinutes(a.pickupTime) - timeToMinutes(b.pickupTime));
  searchTrips();
  setStatus("Showing earliest trip per patient", "done");
}
</script>
</body>
</html>
